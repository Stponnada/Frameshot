    const apExport = document.getElementById('ap-export');
    const apClear = document.getElementById('ap-clear');

    btnAuthor.addEventListener('click', () => {
      const on = document.body.classList.toggle('authoring');
      btnAuthor.classList.toggle('active', on);
      if (on) { syncLightSliders(); updateVpBadge(); renderTextSlots(); }
      renderSequence();
    });

    const btnPhone = document.getElementById('btn-phone');
    btnPhone.addEventListener('click', () => {
      const on = document.body.classList.toggle('phone');
      btnPhone.classList.toggle('active', on);
    });

    function currentView() {
      return {
        pos: [round(camera.position.x), round(camera.position.y), round(camera.position.z)],
        target: [round(controls.target.x), round(controls.target.y), round(controls.target.z)],
      };
    }
    function round(n) { return Math.round(n * 1000) / 1000; }

    apCapture.addEventListener('click', () => {
      if (!model) { showToast('Load a model first'); return; }
      const caption = apCaption.value.trim() || `View ${states.length + 1}`;
      const v = currentView();
      const st = { caption, pos: v.pos, target: v.target };
      const ls = lightSnapshot();
      if (ls) st.light = ls;
      states.push(st);
      activeIndex = states.length - 1;
      apCaption.value = '';
      saveStates();
      renderSequence();
      renderTextSlots();
      syncLightSliders();
      showToast('View captured');
    });

    apUpdate.addEventListener('click', () => {
      if (activeIndex < 0) { showToast('Select a view to update first'); return; }
      const v = currentView();
      const ls = lightSnapshot();
      if (isPortrait()) {
        // Write a portrait-only override; leave the landscape pose untouched.
        const p = states[activeIndex].portrait || (states[activeIndex].portrait = {});
        p.pos = v.pos;
        p.target = v.target;
        if (ls) p.light = ls; else delete p.light;
        saveStates();
        renderSequence();
        showToast('Portrait view updated');
        return;
      }
      states[activeIndex].pos = v.pos;
      states[activeIndex].target = v.target;
      if (apCaption.value.trim()) states[activeIndex].caption = apCaption.value.trim();
      if (ls) states[activeIndex].light = ls;
      else delete states[activeIndex].light;
      saveStates();
      renderSequence();
      showToast('View updated');
    });

    apExport.addEventListener('click', async () => {
      const json = JSON.stringify(states, null, 2);
      downloadBlob(new Blob([json], { type: 'application/json' }), fileStem() + '-views.json');
      try {
        await navigator.clipboard.writeText(json);
        showToast('Saved views JSON (also copied)');
      } catch (e) {
        showToast('Saved views JSON');
      }
    });

    apClear.addEventListener('click', () => {
      if (!modelName || !confirm('Delete all views for ' + modelName + '?')) return;
      try { localStorage.removeItem(lsKey()); } catch (e) {}
      states = [];
      clearActive();
      showToast('Views cleared');
    });

    const fileJson = document.getElementById('file-json');
    document.getElementById('ap-import').addEventListener('click', () => {
      if (!modelName) { showToast('Load a model first'); return; }
      fileJson.click();
    });
    fileJson.addEventListener('change', async () => {
      const f = fileJson.files[0];
      fileJson.value = '';
      if (!f) return;
      const fail = (body, fix, raw) => showReport({
        kind: 'error', label: 'Couldn’t import views', offerOpen: false,
        title: `${quoted(f.name)} isn’t a views file`, body, fix, raw,
        facts: { File: f.name, Size: fmtBytes(f.size), 'Current model': modelName },
      });
      let data;
      try {
        data = JSON.parse(await f.text());
      } catch (e) {
        fail('The file isn’t valid JSON, so it can’t be read.', 'Use a file saved with Export in Author mode.', e.message);
        return;
      }
      if (!Array.isArray(data)) {
        const keys = data && typeof data === 'object' ? Object.keys(data).slice(0, 5).join(', ') : typeof data;
        fail(`A views file is a list of views, but this file holds ${data && typeof data === 'object' ? 'an object with the keys ' + keys : 'a ' + keys}.`,
          'Use a file saved with Export in Author mode.');
        return;
      }
      const bad = data.findIndex((v) => !v || !Array.isArray(v.pos) || v.pos.length !== 3 || !Array.isArray(v.target) || v.target.length !== 3);
      if (bad >= 0) {
        fail(`View ${bad + 1} of ${data.length} is missing its camera position or target (each needs “pos” and “target” as three numbers).`,
          'Re-export the views, or fix that entry by hand.');
        return;
      }
      states = data;
      saveStates();
      clearActive();
      showToast(`Imported ${states.length} view${states.length === 1 ? '' : 's'}`);
    });

    // ============================================================
    //  Lighting authoring (sliders)
    // ============================================================
    const LIGHT_META = {
      exposure:     { label: 'Exposure',      min: 0.2,  max: 2.5, step: 0.05 },
      keyIntensity: { label: 'Key intensity', min: 0,    max: 6,   step: 0.1 },
      keyAzimuth:   { label: 'Key angle',     min: -180, max: 180, step: 1 },
      keyElevation: { label: 'Key height',    min: 0,    max: 90,  step: 1 },
      rimIntensity: { label: 'Rim / edge',    min: 0,    max: 5,   step: 0.1 },
      ambient:      { label: 'Shadow fill',   min: 0,    max: 1,   step: 0.01 },
    };

    const apLights = document.getElementById('ap-lights');
    const apLightTitle = document.getElementById('ap-light-title');
    const apLightReset = document.getElementById('ap-light-reset');
    const lightInputs = {};
    const lightValEls = {};

    function formatVal(k, v) {
      if (k === 'keyAzimuth' || k === 'keyElevation') return Math.round(v) + '°';
      return (Math.round(v * 100) / 100).toString();
    }

    for (const k of LIGHT_KEYS) {
      const meta = LIGHT_META[k];
      const row = document.createElement('div'); row.className = 'light-row';
      const head = document.createElement('div'); head.className = 'lr-head';
      const lab = document.createElement('span'); lab.textContent = meta.label;
      const val = document.createElement('span'); val.className = 'lr-val';
      head.appendChild(lab); head.appendChild(val);
      const input = document.createElement('input');
      input.type = 'range';
      input.min = meta.min; input.max = meta.max; input.step = meta.step;
      input.setAttribute('aria-label', meta.label);
      input.addEventListener('input', () => {
        const v = parseFloat(input.value);
        liveLight[k] = v;
        applyLight(liveLight);
        val.textContent = formatVal(k, v);
        if (activeIndex >= 0) {
          states[activeIndex].light = { ...liveLight };
          saveStates();
        }
      });
      row.appendChild(head); row.appendChild(input);
      apLights.appendChild(row);
      lightInputs[k] = input;
      lightValEls[k] = val;
    }

    function syncLightSliders() {
      for (const k of LIGHT_KEYS) {
        if (!lightInputs[k]) continue;
        lightInputs[k].value = liveLight[k];
        lightValEls[k].textContent = formatVal(k, liveLight[k]);
      }
      apLightTitle.textContent = activeIndex >= 0
        ? `Lighting · view ${activeIndex + 1}`
        : 'Lighting · default';
    }
    syncLightSliders();

    function lightSnapshot() {
      const differs = LIGHT_KEYS.some((k) => Math.abs(liveLight[k] - DEFAULT_LIGHT[k]) > 1e-6);
      return differs ? { ...liveLight } : null;
    }

    apLightReset.addEventListener('click', () => {
      Object.assign(liveLight, DEFAULT_LIGHT);
      applyLight(liveLight);
      if (activeIndex >= 0) { delete states[activeIndex].light; saveStates(); }
      syncLightSliders();
      showToast('Lighting reset to default');
    });

    // ============================================================
    //  Frame shot — PNG of the current render, transparent background.
    //  (HTML titles/captions are overlays and are not included.)
    // ============================================================
    function fileStem() {
      return (modelName || 'frame').replace(/\.[^.]+$/, '').replace(/[^\w.-]+/g, '_');
    }
    function downloadBlob(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    document.getElementById('btn-shot').addEventListener('click', () => {
      if (!model) { showToast('Load a model first'); return; }
      const prev = renderer.getPixelRatio();
      renderer.setPixelRatio(SHOT_PIXEL_RATIO);
      renderer.setSize(renderW(), renderH(), false);
      renderer.render(scene, camera);
      // toBlob must run in the same task as render (no preserveDrawingBuffer)
      const view = activeIndex >= 0 ? `-v${activeIndex + 1}` : '';
      const name = `${fileStem()}${view}-${renderW() * SHOT_PIXEL_RATIO}x${renderH() * SHOT_PIXEL_RATIO}.png`;
      renderer.domElement.toBlob((blob) => {
        if (blob) { downloadBlob(blob, name); showToast('Saved ' + name); }
      }, 'image/png');
      renderer.setPixelRatio(prev);
      renderer.setSize(renderW(), renderH(), false);
    });

    // ============================================================
    //  Toast
    // ============================================================
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 1800);
    }

    // ============================================================
    //  Standard controls
    // ============================================================
    const btnPlay = document.getElementById('btn-play');
    const btnRotate = document.getElementById('btn-rotate');
    const btnReset = document.getElementById('btn-reset');
    const btnWire = document.getElementById('btn-wire');

    btnPlay.addEventListener('click', () => {
      if (playing) stopPlay();
      else startPlay();
    });

    // ============================================================
    //  Audio — ambient bed (loops during Play) + transition SFX.
    //  Muted by default; toggled by the Sound button. Drop files at:
    //    audio/bed.mp3     — seamless dark ambient loop
    //    audio/whoosh.mp3  — camera-move transition
    //    audio/tick.mp3    — soft hit when a caption appears
    //  Missing files fail silently — the toggle just won't make sound.
    // ============================================================
    const AUDIO_SRC = { bed: 'audio/bed.mp3', whoosh: 'audio/whoosh.mp3', tick: 'audio/tick.mp3' };
    let audioOn = false;

    const bedAudio = new Audio(AUDIO_SRC.bed);
    bedAudio.loop = true;
    bedAudio.volume = 0.45;
    bedAudio.preload = 'metadata';
    bedAudio.addEventListener('error', () => {}); // ignore a missing file
    // Only offer Sound when there's a bed track to play.
    bedAudio.addEventListener('loadedmetadata', () => { document.getElementById('btn-sound').hidden = false; });

    function playSfx(src, vol) {
      if (!audioOn) return;
      try {
        const a = new Audio(src);
        a.volume = vol;
        a.play().catch(() => {});
      } catch (e) { /* ignore */ }
    }
    function startBed() { if (audioOn) bedAudio.play().catch(() => {}); }
    function stopBed() { bedAudio.pause(); }

    const btnSound = document.getElementById('btn-sound');
    btnSound.addEventListener('click', () => {
      audioOn = !audioOn;
      btnSound.classList.toggle('active', audioOn);
      if (audioOn) startBed();
      else stopBed();
    });

    btnRotate.addEventListener('click', () => {
      stopPlay();
      controls.autoRotate = !controls.autoRotate;
      btnRotate.classList.toggle('active', controls.autoRotate);
      if (controls.autoRotate) clearActive();
    });

    btnReset.addEventListener('click', () => {
      if (!model) return;
      stopPlay();
      controls.autoRotate = false;
      btnRotate.classList.remove('active');
      clearActive();
      tweenTo(homeState.pos, homeState.target, { ...DEFAULT_LIGHT });
    });

    let wireOn = false;
    btnWire.addEventListener('click', () => {
      wireOn = !wireOn;
      wireMeshes.forEach((m) => forEachMaterial(m, (mat) => { mat.wireframe = wireOn; }));
      btnWire.classList.toggle('active', wireOn);
    });

    // Keyboard: arrows step through sequence
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); stepState(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); stepState(-1); }
    });

    // --- Resize (observe the stage so it also fires on phone-mode toggle) ---
    function onStageResize() {
      if (exporting) return; // the exporter owns the renderer size
      camera.aspect = renderW() / renderH();
      camera.updateProjectionMatrix();
      renderer.setSize(renderW(), renderH());
      const p = isPortrait();
      if (p !== lastPortrait) {
        lastPortrait = p;
        updateVpBadge();
        if (activeIndex >= 0) goToState(activeIndex); // re-frame for the new orientation
      }
    }
    new ResizeObserver(onStageResize).observe(stageEl);

    function updateVpBadge() {
      const badge = document.getElementById('ap-vp');
      if (badge) badge.textContent = isPortrait() ? 'Portrait' : 'Landscape';
    }

    // ============================================================
    //  Export video — replays the sequence offline, frame by frame,
    //  at a fixed frame rate (so it's smooth however slow the machine),
    //  composites the caption overlays into each frame, and encodes
    //  H.264 MP4 with WebCodecs + mp4-muxer.
    //  Timing matches Play: camera move, captions fade in on arrival,
    //  each view holds for PLAY_DWELL_MS from arrival.
    // ============================================================
    const VIDEO_FPS = 30;
    const VIDEO_LONG_EDGE = 1920;
    const VIDEO_BITRATE = 12_000_000;
    const MOVE_S = 1 / 0.025 / 60;   // the live tween: 40 steps at 60 fps
    const REVEAL_S = 0.7;            // --t-reveal
    const MP4_MUXER_URL = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/+esm';
    let exporting = false;
    let exportCancelled = false;

    function isFrontSlot(rv, k) {
      return rv.titleLayer && Object.prototype.hasOwnProperty.call(rv.titleLayer, k)
        ? rv.titleLayer[k]
        : k !== 'left' && k !== 'right';
    }

    // Lay a view's captions out in the real DOM (transitions off) and read
    // back exactly where the browser puts every line, hidden and shown, so
    // the video matches the live overlays.
    function measureCaptions(rv) {
      const stageRect = stageEl.getBoundingClientRect();
      const slots = [];
      document.body.classList.add('measuring');
      applyTitlePositions(rv.titlePos || {});
      for (const k of OV_KEYS) {
        const txt = rv.title && rv.title[k];
        if (!txt) continue;
        const el = ovSlots[k];
        el.textContent = txt;
        el.classList.remove('visible');
        const hiddenRect = el.getBoundingClientRect();
        el.classList.add('visible');
        const shownRect = el.getBoundingClientRect();
        const cs = getComputedStyle(el);

        // Split into the browser's own line breaks using word rects.
        const node = el.firstChild;
        const words = [...txt.matchAll(/\S+/g)];
        const lines = [];
        const range = document.createRange();
        for (const w of words) {
          range.setStart(node, w.index);
          range.setEnd(node, w.index + w[0].length);
          const r = range.getBoundingClientRect();
          const last = lines[lines.length - 1];
          if (last && Math.abs(r.top - last.top) < r.height / 2) {
            last.end = w.index + w[0].length;
            last.right = r.right;
          } else {
            lines.push({ start: w.index, end: w.index + w[0].length, left: r.left, top: r.top, right: r.right, height: r.height });
          }
        }
        slots.push({
          front: isFrontSlot(rv, k),
          font: `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`,
          fontSize: parseFloat(cs.fontSize),
          letterSpacing: parseFloat(cs.letterSpacing) || 0,
          color: cs.color,
          dx: hiddenRect.left - shownRect.left,
          dy: hiddenRect.top - shownRect.top,
          lines: lines.map((l) => ({
            text: txt.slice(l.start, l.end),
            x: l.left - stageRect.left,
            cy: l.top + l.height / 2 - stageRect.top,
          })),
        });
        el.classList.remove('visible');
        el.textContent = '';
      }
      document.body.classList.remove('measuring');
      return slots;
    }

    function easeOutReveal(t) { return 1 - Math.pow(1 - t, 4); } // ≈ the --ease curve

    // Draw caption slots (behind or in front of the model) at a reveal amount 0..1.
    function drawCaptions(ctx, slots, amount, front, scale) {
      if (!slots || amount <= 0) return;
      const e = easeOutReveal(amount);
      for (const s of slots) {
        if (s.front !== front) continue;
        ctx.save();
        ctx.globalAlpha = e;
        ctx.font = s.font.replace(/^(\S+) ([\d.]+)px/, (m, w, px) => `${w} ${px * scale}px`);
        if ('letterSpacing' in ctx) ctx.letterSpacing = s.letterSpacing * scale + 'px';
        ctx.fillStyle = s.color;
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = 40 * scale;
        ctx.shadowOffsetY = 4 * scale;
        const ox = s.dx * (1 - e) * scale;
        const oy = s.dy * (1 - e) * scale;
        for (const l of s.lines) ctx.fillText(l.text, l.x * scale + ox, l.cy * scale + oy);
        ctx.restore();
      }
    }

    // The timeline: one segment per view (move, then hold from arrival).
    function buildTimeline() {
      const segs = [];
      let t = 0;
      states.forEach((s, i) => {
        const rv = resolveView(s);
        const move = i === 0 ? 0 : MOVE_S;
        segs.push({
          i, rv, start: t, move,
          end: t + move + PLAY_DWELL_MS / 1000,
          pos: new THREE.Vector3(...rv.pos),
          target: new THREE.Vector3(...rv.target),
          light: rv.light,
          captions: measureCaptions(rv),
        });
        t = segs[segs.length - 1].end;
      });
      return { segs, duration: t };
    }

    function poseAt(timeline, t) {
      const { segs } = timeline;
      let k = segs.findIndex((s) => t < s.end);
      if (k < 0) k = segs.length - 1;
      const seg = segs[k];
      const prev = segs[k - 1];
      const local = t - seg.start;
      const moving = prev && local < seg.move;
      const m = moving ? easeInOutCubic(local / seg.move) : 1;
      const pos = prev ? new THREE.Vector3().lerpVectors(prev.pos, seg.pos, m) : seg.pos.clone();
      const target = prev ? new THREE.Vector3().lerpVectors(prev.target, seg.target, m) : seg.target.clone();
      const light = {};
      for (const key of LIGHT_KEYS) {
        light[key] = prev ? prev.light[key] + (seg.light[key] - prev.light[key]) * m : seg.light[key];
      }
      // Captions: this view's fade in after arrival; the previous view's
      // fade out while the camera leaves (as in the live Play).
      const showIn = Math.max(0, Math.min(1, (local - seg.move) / REVEAL_S));
      const showOut = prev ? Math.max(0, 1 - local / REVEAL_S) : 0;
      return { pos, target, light, seg, prev, showIn, showOut };
    }

    function exportFacts(w, h, frames, seconds) {
      return {
        Views: String(states.length),
        Size: `${w} × ${h}`,
        Length: `${seconds.toFixed(1)} s (${frames} frames at ${VIDEO_FPS} fps)`,
        Format: 'MP4, H.264, no audio',
      };
    }

    async function pickVideoCodec(w, h) {
      if (typeof VideoEncoder === 'undefined') return null;
      for (const codec of ['avc1.640033', 'avc1.4d0033', 'avc1.42003e']) {
        const cfg = { codec, width: w, height: h, bitrate: VIDEO_BITRATE, framerate: VIDEO_FPS };
        try {
          const { supported } = await VideoEncoder.isConfigSupported(cfg);
          if (supported) return cfg;
        } catch (e) { /* try the next profile */ }
      }
      return null;
    }

    async function exportVideo() {
      if (exporting) return;
      if (!model) return;
      if (states.length === 0) {
        showReport({
          kind: 'error', label: 'Couldn’t export video', offerOpen: false,
          title: 'There’s no sequence to export yet',
          body: `Export video plays your captured views in order, like Play. ${quoted(modelName)} has no views yet.`,
          fix: 'Open Author, frame the model and press Capture new for each shot, then export again.',
          primary: { text: 'Open Author', run: () => { if (!document.body.classList.contains('authoring')) btnAuthor.click(); } },
        });
        return;
      }

      // Output keeps the stage's shape (landscape, portrait or phone frame).
      const aspect = renderW() / renderH();
      const even = (n) => Math.max(2, Math.round(n / 2) * 2);
      const outW = aspect >= 1 ? VIDEO_LONG_EDGE : even(VIDEO_LONG_EDGE * aspect);
      const outH = aspect >= 1 ? even(VIDEO_LONG_EDGE / aspect) : VIDEO_LONG_EDGE;

      const config = await pickVideoCodec(outW, outH);
      if (!config) {
        showReport({
          kind: 'error', label: 'Couldn’t export video', offerOpen: false,
          title: typeof VideoEncoder === 'undefined'
            ? 'This browser can’t encode video'
            : `This browser can’t encode H.264 at ${outW} × ${outH}`,
          body: typeof VideoEncoder === 'undefined'
            ? 'Video export uses the WebCodecs API (VideoEncoder), which this browser doesn’t provide.'
            : 'The browser’s video encoder rejected every H.264 profile tried (High, Main and Baseline) at this size.',
          fix: 'Use a recent Chrome, Edge or Safari (16.4 or later). If you’re in Phone frame mode, try turning it off to export landscape.',
          facts: { Size: `${outW} × ${outH}`, Browser: navigator.userAgent },
        });
        return;
      }

      let Muxer, ArrayBufferTarget;
      try {
        ({ Muxer, ArrayBufferTarget } = await import(MP4_MUXER_URL));
      } catch (e) {
        showReport({
          kind: 'error', label: 'Couldn’t export video', offerOpen: false,
          title: 'Couldn’t load the MP4 writer',
          body: 'Video export downloads a small library (mp4-muxer) from cdn.jsdelivr.net to package the frames as MP4, and that download failed.',
          fix: 'Check your internet connection, then try again.',
          raw: String(e && e.message || e),
        });
        return;
      }

      stopPlay();
      controls.autoRotate = false;
      btnRotate.classList.remove('active');
      const saved = {
        pos: camera.position.clone(), target: controls.target.clone(),
        light: { ...liveLight }, pixelRatio: renderer.getPixelRatio(), active: activeIndex,
      };
      hideOverlays();
      tween = null;
      exporting = true;
      exportCancelled = false;
      document.body.classList.add('exporting');
      controls.enabled = false;

      const timeline = buildTimeline();
      const frames = Math.ceil(timeline.duration * VIDEO_FPS);
      const facts = exportFacts(outW, outH, frames, timeline.duration);
      const fileName = `${fileStem()}-sequence-${outW}x${outH}.mp4`;
      showReport({
        kind: 'progress', label: 'Exporting video', offerOpen: false,
        title: 'Rendering frame 0 of ' + frames, facts, closeText: 'Cancel',
        onClose: () => { exportCancelled = true; },
      });
      setReportProgress(0);

      const comp = document.createElement('canvas');
      comp.width = outW;
      comp.height = outH;
      const ctx = comp.getContext('2d');
      const scale = outW / renderW();

      renderer.setPixelRatio(1);
      renderer.setSize(outW, outH, false);
      camera.aspect = outW / outH;
      camera.updateProjectionMatrix();

      let encodeError = null;
      const target = new ArrayBufferTarget();
      const muxer = new Muxer({ target, video: { codec: 'avc', width: outW, height: outH, frameRate: VIDEO_FPS }, fastStart: 'in-memory' });
      const encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: (e) => { encodeError = e; },
      });
      encoder.configure(config);

      try {
        for (let f = 0; f < frames; f++) {
          if (exportCancelled) break;
          if (encodeError) throw encodeError;
          const p = poseAt(timeline, f / VIDEO_FPS);
          camera.position.copy(p.pos);
          camera.lookAt(p.target);
          applyLight(p.light);

          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, outW, outH);
          drawCaptions(ctx, p.prev && p.prev.captions, p.showOut, false, scale);
          drawCaptions(ctx, p.seg.captions, p.showIn, false, scale);
          renderer.render(scene, camera);
          ctx.drawImage(renderer.domElement, 0, 0, outW, outH);
          drawCaptions(ctx, p.prev && p.prev.captions, p.showOut, true, scale);
          drawCaptions(ctx, p.seg.captions, p.showIn, true, scale);

          const frame = new VideoFrame(comp, { timestamp: Math.round(f * 1e6 / VIDEO_FPS), duration: Math.round(1e6 / VIDEO_FPS) });
          encoder.encode(frame, { keyFrame: f % (VIDEO_FPS * 2) === 0 });
          frame.close();

          // Keep the encoder queue short and let the progress panel paint.
          while (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 0));
          if (f % 3 === 0) {
            document.getElementById('report-title').textContent = `Rendering frame ${f + 1} of ${frames}`;
            setReportProgress((f + 1) / frames);
            await new Promise((r) => setTimeout(r, 0));
          }
        }
        if (!exportCancelled) {
          document.getElementById('report-title').textContent = 'Finishing the MP4 file';
          await encoder.flush();
          if (encodeError) throw encodeError;
          muxer.finalize();
          downloadBlob(new Blob([target.buffer], { type: 'video/mp4' }), fileName);
        }
        encoder.close();
      } catch (e) {
        console.error('Video export failed:', e);
        try { encoder.close(); } catch (_) { /* already closed */ }
        restoreAfterExport(saved);
        showReport({
          kind: 'error', label: 'Couldn’t export video', offerOpen: false,
          title: 'The video encoder stopped partway through',
          body: 'Frames were being rendered, but the browser’s video encoder reported an error and the file couldn’t be finished.',
          fix: 'Try again. If it keeps failing, close other heavy tabs, or turn off Phone frame to export a standard landscape size.',
          facts: { ...facts, Codec: config.codec },
          raw: String(e && e.message || e),
        });
        return;
      }

      restoreAfterExport(saved);
      hideReport();
      showToast(exportCancelled ? 'Video export cancelled' : 'Saved ' + fileName);
    }

    function restoreAfterExport(saved) {
      exporting = false;
      document.body.classList.remove('exporting');
      controls.enabled = true;
      renderer.setPixelRatio(saved.pixelRatio);
      // Re-apply the stage size: resizes during the export were skipped.
      renderer.setSize(renderW(), renderH());
      camera.aspect = renderW() / renderH();
      camera.updateProjectionMatrix();
      if (isPortrait() !== lastPortrait) { lastPortrait = isPortrait(); updateVpBadge(); }
      camera.position.copy(saved.pos);
      controls.target.copy(saved.target);
      Object.assign(liveLight, saved.light);
      applyLight(liveLight);
      controls.update();
      activeIndex = saved.active;
      if (activeIndex >= 0) revealOverlays();
    }

    document.getElementById('btn-export-video').addEventListener('click', exportVideo);

    // ============================================================
    //  Render loop
    // ============================================================
    function tick() {
      requestAnimationFrame(tick);
      if (exporting) return; // the exporter drives the renderer

      if (tween) {
        tween.t = Math.min(tween.t + 0.025, 1);
        const e = easeInOutCubic(tween.t);
        camera.position.lerpVectors(tween.fromPos, tween.toPos, e);
        controls.target.lerpVectors(tween.fromTarget, tween.toTarget, e);
        for (const k of LIGHT_KEYS) {
          liveLight[k] = tween.fromLight[k] + (tween.toLight[k] - tween.fromLight[k]) * e;
        }
        applyLight(liveLight);
        if (tween.t >= 1) {
          tween = null;
          if (activeIndex >= 0) revealOverlays();
          syncLightSliders();
          if (playing) scheduleNextPlayStep();
        }
      }

      controls.update();

      renderer.render(scene, camera);
    }

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    renderSequence();
    tick();

    // On start: ?model=path/to/file.glb loads a model served next to this
    // page; otherwise reopen the last model that was opened from disk.
    const initialModel = new URLSearchParams(location.search).get('model');
    if (initialModel) {
      loadModel(initialModel, baseName(initialModel));
    } else {
      loaderEl.classList.remove('idle');
      loaderPct.textContent = 'Reopening your last model';
      recallLastModel().then((files) => {
        if (files) loadFiles(files, 'restored');
        else loaderEl.classList.add('idle');
      });
    }
  </script>
</body>
</html>
